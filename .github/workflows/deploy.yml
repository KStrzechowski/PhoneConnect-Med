name: deploy

on:
  push:
    branches: [main]
    paths: ['his/**']

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      INSTANCE_ID: ${{ vars.MOCK_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/phoneconnect-med-his
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" his
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Start the instance and wait for it to register
        run: |
          aws ec2 start-instances --instance-ids "$INSTANCE_ID"
          aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
          for _ in $(seq 1 30); do
            registered=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'length(InstanceInformationList)' --output text)
            if [ "$registered" = "1" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "instance never registered with SSM" >&2
          exit 1

      - name: Restart the containers and run migrations
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/phoneconnect-med-his:${{ github.sha }}
        run: |
          jq -n --arg registry "$REGISTRY" --arg image "$IMAGE" --arg region "$AWS_REGION" '{
            commands: [
              "set -e",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "docker pull \($image)",
              "echo HIS_IMAGE=\($image) > /opt/his/.env",
              "docker compose -f /opt/his/docker-compose.yml --env-file /opt/his/.env up -d postgres",
              "docker compose -f /opt/his/docker-compose.yml --env-file /opt/his/.env run --rm his node_modules/.bin/typeorm migration:run -d dist/data-source.js",
              "docker compose -f /opt/his/docker-compose.yml --env-file /opt/his/.env up -d his"
            ]
          }' > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://params.json \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID" || failed=yes
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID"
          [ -z "$failed" ]
